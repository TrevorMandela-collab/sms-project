<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — School Management</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="../shared/auth-client.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1 class="chalk-title login-title">School Management</h1>
        <p class="chalk-sub login-sub" id="modeSubtitle">
          Sign in to your account
        </p>

        <div
          class="error-banner"
          id="errorBanner"
          role="alert"
          aria-live="assertive"
          style="display: none"
        ></div>

        <!-- Sign in form -->
        <form id="loginForm">
          <div class="form-field">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-field">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="chalk-btn login-submit">Sign In</button>
        </form>
        <p class="login-footnote">
          <a class="link-btn" href="../forgot-password/index.html">
            Forgot your password?
          </a>
        </p>

        <!-- First-run bootstrap admin form (shown automatically if no accounts exist) -->
        <form id="bootstrapForm" style="display: none">
          <div class="form-field">
            <label for="bootSchoolName">School Name</label>
            <input
              type="text"
              id="bootSchoolName"
              required
              autocomplete="organization"
            />
          </div>
          <div class="form-field">
            <label for="bootName">Your Name</label>
            <input type="text" id="bootName" required />
          </div>
          <div class="form-field">
            <label for="bootEmail">Email</label>
            <input type="email" id="bootEmail" required />
          </div>
          <div class="form-field">
            <label for="bootPassword">Password</label>
            <input type="password" id="bootPassword" required minlength="12" />
          </div>
          <button type="submit" class="chalk-btn login-submit">
            Create School &amp; Admin Account
          </button>
        </form>

        <p class="login-footnote" id="loginFootnote">
          First time here?
          <button type="button" class="link-btn" id="showBootstrapBtn">
            Set up the admin account
          </button>
        </p>
        <p class="login-footnote" id="studentRegisterFootnote">
          Have an invite code?
          <a class="link-btn" href="../register/index.html">Register here</a>
        </p>
      </div>
    </div>

  </body>
</html>
