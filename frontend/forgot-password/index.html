<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password — School Management</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../login/style.css" />
  </head>
  <body>
    <main class="login-wrap">
      <section class="login-card" aria-labelledby="pageTitle">
        <h1 class="chalk-title login-title" id="pageTitle">Forgot password?</h1>
        <p class="chalk-sub login-sub">
          Enter the email address associated with your school account.
        </p>
        <p id="requestStatus" class="error-banner" role="status" hidden></p>
        <form id="forgotPasswordForm">
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <button class="chalk-btn login-submit" type="submit">Send reset link</button>
        </form>
        <p class="login-footnote">
          <a class="link-btn" href="../login/index.html">Back to sign in</a>
        </p>
      </section>
    </main>
    <script src="../shared/auth-client.js"></script>
    <script src="script.js"></script>
  </body>
</html>
