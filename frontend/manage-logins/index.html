<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Logins — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <main class="app-main">
<div class="board">

  <header class="board-header">
    <div>
      <h1 class="chalk-title">Manage Logins</h1>
      <p class="chalk-sub">Create teacher and parent accounts</p>
    </div>
    <div class="header-right" style="display:flex; align-items:center; gap:16px;">
      <div id="userBadgeSlot"></div>
    </div>
  </header>

  <section class="login-forms-row">

    <div class="panel">
      <div class="panel-head">
        <h2>Create Teacher Login</h2>
      </div>
      <form id="createTeacherForm">
        <div class="form-field">
          <label for="tchLoginName">Full Name</label>
          <input type="text" id="tchLoginName" required>
        </div>
        <div class="form-field">
          <label for="tchLoginEmail">Email</label>
          <input type="email" id="tchLoginEmail" required>
        </div>
        <div class="form-field">
          <label for="tchLoginPassword">Temporary Password</label>
          <input type="password" id="tchLoginPassword" required minlength="6">
        </div>
        <div class="form-field">
          <label for="teacherLinkSelect">Link to Teacher Record (optional)</label>
          <select id="teacherLinkSelect">
            <option value="">— not linked —</option>
          </select>
        </div>
        <p class="form-message" id="teacherFormMessage"></p>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button type="submit" class="chalk-btn">Create Teacher Login</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Create Parent Login</h2>
      </div>
      <form id="createParentForm">
        <div class="form-field">
          <label for="parLoginName">Full Name</label>
          <input type="text" id="parLoginName" required>
        </div>
        <div class="form-field">
          <label for="parLoginEmail">Email</label>
          <input type="email" id="parLoginEmail" required>
        </div>
        <div class="form-field">
          <label for="parLoginPassword">Temporary Password</label>
          <input type="password" id="parLoginPassword" required minlength="6">
        </div>
        <div class="form-field">
          <label>Children</label>
          <input type="search" id="childSearchInput" placeholder="Search students...">
          <div class="child-checkbox-list" id="childCheckboxList">
            <div class="loading-state">Loading students…</div>
          </div>
        </div>
        <p class="form-message" id="parentFormMessage"></p>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button type="submit" class="chalk-btn">Create Parent Login</button>
        </div>
      </form>
    </div>

  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Existing Accounts</h2>
      <div class="filter-row">
        <input type="search" id="accountSearchInput" placeholder="Search by name or email...">
        <select id="accountRoleFilter">
          <option value="all">All roles</option>
          <option value="admin">Admin</option>
          <option value="teacher">Teacher</option>
          <option value="parent">Parent</option>
          <option value="student">Student</option>
        </select>
      </div>
    </div>

    <table class="ledger-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Linked To</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="accountsTableBody"></tbody>
    </table>
  </section>

</div>
  </main>
</div>

<script src="../shared/auth-client.js"></script>
<script src="../shared/auth-guard.js"></script>
<script src="../shared/sidebar.js"></script>
<script src="script.js"></script>
</body>
</html>
