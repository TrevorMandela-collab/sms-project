<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="board">

  <header class="board-header">
    <div>
      <a class="back-link" href="../dashboard/index.html">← Dashboard</a>
      <h1 class="chalk-title">Teachers</h1>
      <p class="chalk-sub">Staff directory and subject assignments</p>
    </div>
    <div class="header-right" style="display:flex; align-items:center; gap:16px;">
      <div id="userBadgeSlot"></div>
      <button class="chalk-btn" id="newTeacherBtn" data-requires-role="admin">＋ Add Teacher</button>
    </div>
  </header>

  <section class="stat-strip">
    <div class="stat-card">
      <span class="stat-value" id="statTotal">0</span>
      <span class="stat-label">Total Teachers</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="statSubjects">0</span>
      <span class="stat-label">Subjects Covered</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Staff Directory</h2>
      <div class="filter-row">
        <input type="search" id="searchInput" placeholder="Search by name...">
        <select id="subjectFilter">
          <option value="all">All subjects</option>
        </select>
      </div>
    </div>

    <table class="ledger-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Subjects</th>
          <th>Contact</th>
          <th data-requires-role="admin"></th>
        </tr>
      </thead>
      <tbody id="teachersTableBody"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </section>

</div>

<!-- Add / Edit modal -->
<div class="modal-overlay" id="teacherModalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Add Teacher</h3>
    <form id="teacherForm">
      <input type="hidden" id="teacherId">
      <div class="form-field">
        <label for="teaName">Full Name</label>
        <input type="text" id="teaName" required>
      </div>
      <div class="form-field">
        <label for="teaSubjectInput">Subjects</label>
        <div class="tag-input" id="tagInput">
          <div class="tag-chips" id="tagChips"></div>
          <input type="text" id="teaSubjectInput" placeholder="Type a subject and press Enter">
        </div>
      </div>
      <div class="form-field">
        <label for="teaContact">Contact</label>
        <input type="text" id="teaContact" placeholder="Phone or email">
      </div>
      <div class="modal-actions">
        <button type="button" class="chalk-btn chalk-btn--outline" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="chalk-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="../shared/auth-client.js"></script>
<script src="../shared/auth-guard.js"></script>
<script src="script.js"></script>
</body>
</html>
