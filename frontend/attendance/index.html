<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <main class="app-main">
<div class="board">

  <header class="board-header">
    <div>
      <h1 class="chalk-title">Attendance</h1>
      <p class="chalk-sub">Mark and review daily attendance by class</p>
    </div>
    <div class="header-right" style="display:flex; align-items:center; gap:16px;">
      <div id="userBadgeSlot"></div>
    </div>
  </header>

  <section class="panel" data-requires-role="admin,teacher">
    <div class="panel-head">
      <h2>Mark Attendance</h2>
      <div class="controls">
        <div class="form-field" style="margin-bottom:0;">
          <label for="classSelect">Class</label>
          <select id="classSelect"></select>
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label for="dateSelect">Date</label>
          <input type="date" id="dateSelect">
        </div>
        <button class="chalk-btn" id="saveAttendanceBtn" style="align-self:flex-end;">Save Attendance</button>
      </div>
    </div>

    <div class="attendance-summary" id="attendanceSummary"></div>

    <table class="ledger-table">
      <thead>
        <tr>
          <th>Student</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="attendanceTableBody"></tbody>
    </table>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 id="historyTitle">Attendance History</h2>
    </div>
    <table class="ledger-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Class</th>
          <th>Present</th>
          <th>Absent</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody id="historyTableBody"></tbody>
    </table>
  </section>

</div>
  </main>
</div>

<script src="../shared/auth-client.js"></script>
<script src="../shared/auth-guard.js"></script>
<script src="../shared/sidebar.js"></script>
<script src="script.js"></script>
</body>
</html>
