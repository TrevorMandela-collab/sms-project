<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — School Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/startup.css" />
    <script src="../shared/startup.js"></script>
    <link rel="stylesheet" href="../login/style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1 class="chalk-title login-title">Account Registration</h1>
        <p class="chalk-sub login-sub">
          Choose your role and enter the invite code from your school admin
        </p>

        <div class="error-banner" id="errorBanner" style="display: none"></div>

        <form id="registerForm">
          <div class="form-field">
            <label for="regRole">I am joining as</label>
            <select id="regRole" required>
              <option value="teacher">Teacher</option>
              <option value="parent">Parent</option>
              <option value="student">Student</option>
            </select>
          </div>
          <div class="form-field">
            <label for="regCode">Invite Code</label>
            <input
              type="text"
              id="regCode"
              required
              placeholder="ABCD-1234"
              autocomplete="off"
              style="text-transform: uppercase"
            />
          </div>
          <div class="form-field">
            <label for="regName">Your Name</label>
            <input type="text" id="regName" required autocomplete="name" />
          </div>
          <div class="form-field">
            <label for="regEmail">Email</label>
            <input
              type="email"
              id="regEmail"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-field">
            <label for="regPassword">Password</label>
            <input
              type="password"
              id="regPassword"
              required
              minlength="12"
              autocomplete="new-password"
            />
          </div>
          <button type="submit" class="chalk-btn login-submit">
            Create My Account
          </button>
        </form>

        <p class="login-footnote">
          Already have an account?
          <a class="link-btn" href="../login/index.html">Sign in</a>
        </p>
      </div>
    </div>

    <script src="../shared/auth-client.js"></script>
    <script src="script.js"></script>
  </body>
</html>
