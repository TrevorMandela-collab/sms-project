<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <main class="app-main">
<div class="board">

  <header class="board-header">
    <div>
      <h1 class="chalk-title">Students</h1>
      <p class="chalk-sub">Manage student records and enrollment</p>
    </div>
    <div class="header-right" style="display:flex; align-items:center; gap:16px;">
      <div id="userBadgeSlot"></div>
      <button class="chalk-btn" id="newStudentBtn" data-requires-role="admin">＋ Add Student</button>
    </div>
  </header>

  <section class="stat-strip">
    <div class="stat-card">
      <span class="stat-value" id="statTotal">0</span>
      <span class="stat-label">Total Students</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="statClasses">0</span>
      <span class="stat-label">Classes</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Student Roster</h2>
      <div class="filter-row">
        <input type="search" id="searchInput" placeholder="Search by name...">
        <select id="classFilter">
          <option value="all">All classes</option>
        </select>
      </div>
    </div>

    <table class="ledger-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Date of Birth</th>
          <th>Guardian Contact</th>
          <th data-requires-role="admin"></th>
        </tr>
      </thead>
      <tbody id="studentsTableBody"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </section>

</div>
  </main>
</div>

<!-- Add / Edit modal -->
<div class="modal-overlay" id="studentModalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Add Student</h3>
    <form id="studentForm">
      <input type="hidden" id="studentId">
      <div class="form-field">
        <label for="stuName">Full Name</label>
        <input type="text" id="stuName" required>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="stuClass">Class</label>
          <input type="text" id="stuClass" required placeholder="e.g. Grade 7B">
        </div>
        <div class="form-field">
          <label for="stuDob">Date of Birth</label>
          <input type="date" id="stuDob">
        </div>
      </div>
      <div class="form-field">
        <label for="stuGuardianContact">Guardian Contact</label>
        <input type="text" id="stuGuardianContact" placeholder="Phone or email">
      </div>
      <div class="modal-actions">
        <button type="button" class="chalk-btn chalk-btn--outline" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="chalk-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="../shared/auth-client.js"></script>
<script src="../shared/auth-guard.js"></script>
<script src="../shared/sidebar.js"></script>
<script src="script.js"></script>
</body>
</html>
