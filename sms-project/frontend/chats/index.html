<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebarSlot"></div>
  <main class="app-main">
<div class="board board--chats">

  <header class="board-header">
    <div>
      <h1 class="chalk-title">Chats</h1>
      <p class="chalk-sub">Group chats, admin-managed</p>
    </div>
    <div class="header-right" style="display:flex; align-items:center; gap:16px;">
      <div id="userBadgeSlot"></div>
    </div>
  </header>

  <div class="chats-layout">

    <!-- Server rail -->
    <aside class="server-rail">
      <div class="server-rail-list" id="serverRailList"></div>
      <button class="server-rail-btn" id="joinChatBtn" title="Join a chat with a code">+</button>
      <button class="server-rail-btn server-rail-btn--admin" id="createChatBtn" title="Create a new chat" style="display:none;">✎</button>
    </aside>

    <!-- Chat thread -->
    <section class="chat-thread">
      <div class="chat-thread-header" id="chatThreadHeader">
        <span class="chat-thread-title">Select a chat</span>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state">Pick a chat from the left, or join one with an invite code.</div>
      </div>
      <form class="chat-input-row" id="chatInputForm" style="display:none;">
        <input type="text" id="chatInput" placeholder="Message..." autocomplete="off">
        <button type="submit" class="chalk-btn">Send</button>
      </form>
    </section>

  </div>

</div>
  </main>
</div>

<!-- Join-by-code panel -->
<div class="chat-overlay" id="joinOverlay" style="display:none;">
  <div class="chat-overlay-card">
    <h3>Join a Chat</h3>
    <div class="form-field">
      <label for="joinCodeInput">Invite Code</label>
      <input type="text" id="joinCodeInput" placeholder="ABCD-1234">
    </div>
    <p class="form-message" id="joinMessage"></p>
    <div class="modal-actions">
      <button type="button" class="chalk-btn chalk-btn--outline" id="joinCancelBtn">Cancel</button>
      <button type="button" class="chalk-btn" id="joinSubmitBtn">Join</button>
    </div>
  </div>
</div>

<!-- Create-chat panel (admin only) -->
<div class="chat-overlay" id="createOverlay" style="display:none;">
  <div class="chat-overlay-card">
    <h3>Create a Chat</h3>
    <div class="form-field">
      <label for="newChatName">Chat Name</label>
      <input type="text" id="newChatName" placeholder="e.g. Grade 5 Parents">
    </div>
    <div class="form-field">
      <label>Add Members</label>
      <input type="search" id="memberSearchInput" placeholder="Search by name or email...">
      <div class="child-checkbox-list" id="memberCheckboxList">
        <div class="loading-state">Loading users…</div>
      </div>
    </div>
    <p class="form-message" id="createMessage"></p>
    <div class="modal-actions">
      <button type="button" class="chalk-btn chalk-btn--outline" id="createCancelBtn">Cancel</button>
      <button type="button" class="chalk-btn" id="createSubmitBtn">Create</button>
    </div>
  </div>
</div>

<!-- Chat settings panel (admin only — invite code + members) -->
<div class="chat-overlay" id="settingsOverlay" style="display:none;">
  <div class="chat-overlay-card">
    <h3>Chat Settings</h3>
    <div class="form-field">
      <label for="settingsChatName">Chat Name</label>
      <input type="text" id="settingsChatName">
    </div>
    <div class="form-field">
      <label>Invite Code</label>
      <div class="invite-code-box">
        <span id="settingsInviteCode">—</span>
        <button type="button" class="chalk-btn chalk-btn--outline" id="regenerateCodeBtn">Regenerate</button>
      </div>
    </div>
    <div class="form-field">
      <label>Members</label>
      <input type="search" id="settingsMemberSearchInput" placeholder="Search by name or email...">
      <div class="child-checkbox-list" id="settingsMemberCheckboxList"></div>
    </div>
    <p class="form-message" id="settingsMessage"></p>
    <div class="modal-actions">
      <button type="button" class="chalk-btn chalk-btn--outline" id="settingsCancelBtn">Close</button>
      <button type="button" class="chalk-btn" id="settingsSaveBtn">Save Members</button>
    </div>
  </div>
</div>

<script src="../shared/auth-client.js"></script>
<script src="../shared/auth-guard.js"></script>
<script src="../shared/sidebar.js"></script>
<script src="script.js"></script>
</body>
</html>
