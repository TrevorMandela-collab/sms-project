name: Backend tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sms_test
          POSTGRES_PASSWORD: sms_test_password
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_test -d sms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://sms_test:sms_test_password@localhost:5432/sms_test
