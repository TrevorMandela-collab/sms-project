name: Backend tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:sqlite-migrations
      - run: npm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sms_test
          POSTGRES_PASSWORD: sms_test_password
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_test -d sms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Pin PostgreSQL service address
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          docker inspect --format '{{json .NetworkSettings.Networks}}' "$POSTGRES_SERVICE_ID" |
            node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                let networks;
                try {
                  networks = JSON.parse(input);
                } catch {
                  console.error("Could not read the PostgreSQL service network identity.");
                  process.exitCode = 1;
                  return;
                }
                const addresses = [...new Set(
                  Object.values(networks).flatMap((network) => [
                    network.IPAddress,
                    network.GlobalIPv6Address,
                  ]).filter(Boolean),
                )].sort();
                if (addresses.length === 0) {
                  console.error("The PostgreSQL service has no inspectable network address.");
                  process.exitCode = 1;
                  return;
                }
                process.stdout.write(
                  `POSTGRES_TEST_EXPECTED_SERVER_ADDRESSES=${JSON.stringify(addresses)}\n`,
                );
              });
            ' >> "$GITHUB_ENV"
      - run: npm run test:postgres-migrations
        env:
          REQUIRE_POSTGRES_TESTS: "1"
          POSTGRES_TEST_OPT_IN: "1"
          POSTGRES_TEST_DISPOSABLE: "1"
          POSTGRES_TEST_EXPECTED_DATABASE: sms_test
          POSTGRES_TEST_EXPECTED_HOST: localhost
          POSTGRES_TEST_EXPECTED_PORT: "5432"
          POSTGRES_TEST_EXPECTED_USER: sms_test
          TEST_DATABASE_URL: postgresql://sms_test:sms_test_password@localhost:5432/sms_test

  notify:
    name: Telegram notification
    if: always()
    needs:
      - sqlite
      - postgres
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SQLITE_RESULT: ${{ needs.sqlite.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Telegram secrets unavailable. Notification skipped.")
              raise SystemExit(0)

          sqlite = os.environ["SQLITE_RESULT"]
          postgres = os.environ["POSTGRES_RESULT"]

          passed = sqlite == "success" and postgres == "success"
          status = "PASSED" if passed else "FAILED"
          icon = "✅" if passed else "❌"

          message = (
              f"{icon} NOVEXA — GitHub Tests {status}\n\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Branch: {os.environ['BRANCH']}\n\n"
              f"SQLite: {sqlite}\n"
              f"PostgreSQL: {postgres}\n\n"
              f"Workflow: {os.environ['RUN_URL']}"
          )

          payload = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": True
          }).encode()

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)

              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected notification")

              print("NOVEXA notification sent.")

          except Exception as error:
              print(f"Telegram notification failed: {type(error).__name__}")
              raise SystemExit(1)
          PY
